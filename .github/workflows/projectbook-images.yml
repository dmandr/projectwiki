name: ProjectBook container images
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['lib/**', 'projectbook/**', '.dockerignore', 'gollum.gemspec', '.github/workflows/projectbook-images.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: projectbook-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: projectbook
            context: .
            dockerfile: projectbook/Dockerfile
          - image: projectbook-manager
            context: projectbook/manager
            dockerfile: projectbook/manager/Dockerfile
          - image: projectbook-rag
            context: projectbook/rag
            dockerfile: projectbook/rag/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dmandr/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dmandr/projectwiki
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
