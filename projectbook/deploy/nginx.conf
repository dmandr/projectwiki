map $http_x_forwarded_proto $book_proto {
    default $scheme;
    https https;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 55m;
    location / {
        proxy_pass http://wiki:4567;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $book_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
