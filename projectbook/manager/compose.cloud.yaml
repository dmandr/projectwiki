# One origin for the Cloudflare hostname. /mcp uses the separate MCP listener.
services:
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8093:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [manager]
    networks: [books]
