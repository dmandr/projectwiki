# Experimental overlay. Separate instance/port, shared book read-only.
services:
  wiki:
    environment:
      GOLLUM_READ_ONLY: 'true'
      PROJECTBOOK_RAG_URL: 'http://rag:8090'
    volumes:
      - type: bind
        source: '${PROJECTBOOK_WIKI_DIR}'
        target: /wiki
        read_only: true
        bind:
          create_host_path: false
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes:
      - rag-vectors:/qdrant/storage
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  rag:
    build: ./rag
    environment:
      BOOK_DIR: /book
      BOOK_REF: '${GOLLUM_REF:-main}'
      QDRANT_URL: http://qdrant:6333
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      MODEL_THREADS: '4'
      BATCH_SIZE: '16'
      POLL_SECONDS: '60'
    volumes:
      - type: bind
        source: '${PROJECTBOOK_WIKI_DIR}'
        target: /book
        read_only: true
        bind:
          create_host_path: false
      - rag-models:/models
      - rag-state:/state
    mem_limit: 4g
    cpus: 4
    depends_on:
      - qdrant
    restart: unless-stopped
volumes:
  rag-vectors:
  rag-models:
  rag-state:
