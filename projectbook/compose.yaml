name: ${PROJECTBOOK_INSTANCE:-projectbook-fork}
services:
  wiki:
    build:
      context: ..
      dockerfile: projectbook/Dockerfile
    image: ${PROJECTBOOK_IMAGE:-projectwiki:local}
    init: true
    ports:
      - '127.0.0.1:${PROJECTBOOK_PORT:-4000}:4567'
    volumes:
      - type: bind
        source: '${PROJECTBOOK_WIKI_DIR:-../../testwiki-projectwiki}'
        target: /wiki
        bind:
          create_host_path: false
    environment:
      APP_ENV: production
      PROJECTBOOK_MIGRATE_TODOS: '${PROJECTBOOK_MIGRATE_TODOS:-false}'
      GOLLUM_REF: '${GOLLUM_REF:-main}'
      GOLLUM_READ_ONLY: '${GOLLUM_READ_ONLY:-false}'
      GOLLUM_EDITOR: '${GOLLUM_EDITOR:-mdx}'
      GOLLUM_TREE: '${GOLLUM_TREE:-true}'
      PROJECTBOOK_MCP_ENABLED: '${PROJECTBOOK_MCP_ENABLED:-true}'
      PROJECTBOOK_MCP_MEMORY_WRITE: '${PROJECTBOOK_MCP_MEMORY_WRITE:-true}'
      PROJECTBOOK_MCP_DOCUMENT_WRITE: '${PROJECTBOOK_MCP_DOCUMENT_WRITE:-true}'
      PROJECTBOOK_MCP_TOKEN: '${PROJECTBOOK_MCP_TOKEN:-}'
      PROJECTBOOK_SETTINGS_ADMIN: '${PROJECTBOOK_SETTINGS_ADMIN:-false}'
      PROJECTBOOK_PUBLIC_URL: 'http://127.0.0.1:${PROJECTBOOK_PORT:-4000}'
    restart: unless-stopped
